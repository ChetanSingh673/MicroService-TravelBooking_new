apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-booking-ingress
  namespace: travel-booking
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:607416643673:certificate/8ff9d18e-9730-46bd-b561-82c474babb1b
spec:
  ingressClassName: alb
  rules:
    - host: cloudmella.store
      http:
        paths:
          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          # User service
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service-service
                port:
                  number: 3001

          # Search service
          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search-service-service
                port:
                  number: 3002

          # Booking service
          - path: /api/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service-service
                port:
                  number: 3003

          # Payment service
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service-service
                port:
                  number: 3004

          # Notification service
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service-service
                port:
                  number: 3005