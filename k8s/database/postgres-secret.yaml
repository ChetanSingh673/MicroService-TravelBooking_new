apiVersion: v1                     # Specifies the Kubernetes API version for creating a Secret.
kind: Secret                       # Defines the Kubernetes resource type as Secret.
metadata:                          # Contains metadata about the Secret.
  name: postgres-secret            # Sets the Secret name to postgres-secret.
  namespace: travel-booking        # Creates the Secret inside the travel-booking namespace.
type: Opaque                       # Specifies a generic Secret for storing sensitive key-value data.
data:                              # Contains Base64-encoded secret values.
  POSTGRES_USER: cG9zdGdyZXM=      # Sets the PostgreSQL username to postgres.
  POSTGRES_PASSWORD: cG9zdGdyZXM=  # Sets the PostgreSQL password to postgres.
  POSTGRES_DB: cG9zdGdyZXM=        # Sets the default PostgreSQL database name to postgres.