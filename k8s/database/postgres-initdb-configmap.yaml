apiVersion: v1                    # Specifies the Kubernetes API version for creating a ConfigMap.
kind: ConfigMap                   # Defines the Kubernetes resource type as ConfigMap.
metadata:                         # Contains metadata about the ConfigMap.
  name: postgres-initdb           # Sets the ConfigMap name to postgres-initdb.
  namespace: travel-booking       # Creates the ConfigMap inside the travel-booking namespace.
data:                             # Contains configuration data stored as key-value pairs.
  init.sql: |                     # Creates a file named init.sql containing the SQL initialization script.
    CREATE DATABASE userdb;       # Creates a PostgreSQL database named userdb.
    CREATE DATABASE searchdb;     # Creates a PostgreSQL database named searchdb.
    CREATE DATABASE bookingdb;    # Creates a PostgreSQL database named bookingdb.
    CREATE DATABASE paymentdb;    # Creates a PostgreSQL database named paymentdb.
    CREATE DATABASE notificationdb; # Creates a PostgreSQL database named notificationdb.