apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: travel-booking
data:
  NODE_ENV: "production"
  PORT: "3004"
  DB_HOST: "postgres-service"  # This need to be same as in the postgres service name
  DB_PORT: "5432"
  DB_SSLMODE: "disable"
  BOOKING_SERVICE_URL: "http://booking-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3005"