apiVersion: v1                   # Specifies the k8s API versions for creating a Secret.      
kind: Secret                     # Define k8s resource type as Secret.
metadata:                        # Contains metadata about the Secret.
  name: booking-service-secret   # Set the Secret name used by the Booking Service Deployment.
type: Opaque                     # Specifies a genric Secret for storing key-value sensitive data.    
data:                            # Contains Base64-encoded secret values.
  DB_USER: cG9zdGdyZXM=          # Stores the postgreSQL username (postgres).
  DB_PASSWORD: cG9zdGdyZXM=      # Stores the postgreSQL password (postgres).
  DB_NAME: Ym9va2luZ2Ri          # Stores the postgreSQL database name (bookingdb).
  JWT_SECRET: c3VwZXJzZWNyZXQ=   # Stores the JWT siging secret (supersecret).