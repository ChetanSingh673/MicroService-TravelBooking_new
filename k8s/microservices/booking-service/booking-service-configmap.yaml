apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
  namespace: travel-booking
data:
  NOD_ENV: "production"
  PORT: "3003"
  DB_HOST: "postgres-service"  # This need to be same as in the postgres service name
  DB_PORT: "5432"
  DB_SSLMODE: "disable"
  USER_SERVICE_URL: "http://user-service-service:3001"
  NOTIFICATION_SERVICE_URL: "http://notification-service-service:3005"