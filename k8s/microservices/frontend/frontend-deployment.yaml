apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  namespace: travel-booking
  labels:
    app: frontend 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
     containers: 
      - name: frontend
        image: chetansingh673/travel-frontend:build-1
        imagePullPolicy: Always         
        ports:
          - containerPort: 80

        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10  

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        env:
          - name: NODE_ENV
            value: production  