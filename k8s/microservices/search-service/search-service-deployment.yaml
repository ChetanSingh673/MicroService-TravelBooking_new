apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service-deployment
  namespace: travel-booking
  labels:
    app: search-service  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: chetansingh673/travel-search-service:build-1
          imagePullPolicy: Always
          ports:
            - containerPort: 3002

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10   
            timeoutSeconds: 5  
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3    

          envFrom:
            - configMapRef:
                name: search-service-config
            - secretRef:
                name: search-service-secret                  